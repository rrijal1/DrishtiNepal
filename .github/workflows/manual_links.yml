name: Manual Link Ingester

# Triggers when anyone pushes a change to data/manual_links.md,
# OR when run manually from the Actions tab.
on:
    push:
        paths:
            - "data/manual_links.md"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Log what would be processed without writing to DB"
                required: false
                default: "false"

env:
    NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
    NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    ENVIRONMENT: production
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    ingest:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: agents/requirements.txt

            - name: Install dependencies
              run: pip install -r agents/requirements.txt

            - name: Run manual link ingester
              run: python -m agents.run manual

            # After ingesting, run the enricher so the new posts get cover images,
            # and the matcher so manifesto links get proper vector-verified links too.
            - name: Enrich new posts (cover images)
              run: python -m agents.run enricher

            - name: Run manifesto matcher on new actions
              run: python -m agents.run matcher
