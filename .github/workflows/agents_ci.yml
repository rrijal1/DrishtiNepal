name: Agent CI

on:
    push:
        branches: [main]
        paths:
            - "agents/**"
    pull_request:
        paths:
            - "agents/**"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: agents/requirements.txt

            - name: Install dependencies
              run: |
                  cd agents
                  pip install -r requirements.txt
                  pip install pytest

            - name: Run linting
              run: |
                  pip install ruff
                  ruff check agents/

            - name: Run tests
              run: pytest agents/tests/ -v
              env:
                  ENVIRONMENT: test
