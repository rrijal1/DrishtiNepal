name: Agent Pipeline (Cron)

on:
    schedule:
        # 3x/day: morning, midday, evening Nepal Time
        # 07:00 NPT = 01:15 UTC, 13:00 NPT = 07:15 UTC, 20:00 NPT = 14:15 UTC
        - cron: "15 1 * * *"
        - cron: "15 7 * * *"
        - cron: "15 14 * * *"
    workflow_dispatch: # Allow manual trigger

env:
    NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
    NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    ENVIRONMENT: production
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    # ── Job 1: Scrape (fast, ~2 min) ────────────────────────
    scrape:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: agents/requirements.txt
            - run: pip install -r agents/requirements.txt
            - name: Run news scraper
              run: python -m agents.run scraper

    # ── Job 2: Analyze + Generate (AI-heavy, ~10 min with concurrency) ──
    generate:
        needs: scrape
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: agents/requirements.txt
            - run: pip install -r agents/requirements.txt
            - name: Run content generator
              run: python -m agents.run generator
            - name: Run action extractor
              run: python -m agents.run extractor

    # ── Job 3: Enrich + Publish (no AI calls, fast) ─────────
    publish:
        needs: generate
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"
                  cache-dependency-path: agents/requirements.txt
            - run: pip install -r agents/requirements.txt
            - name: Run image enricher
              run: python -m agents.run enricher
            - name: Run social publisher
              env:
                  X_API_KEY: ${{ secrets.X_API_KEY }}
                  X_API_SECRET: ${{ secrets.X_API_SECRET }}
                  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
                  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
                  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
                  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
                  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
              run: python -m agents.run publisher
