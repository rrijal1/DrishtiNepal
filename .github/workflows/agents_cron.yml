name: Agent Pipeline (Cron)

on:
    schedule:
        # 3x/day: morning, midday, evening Nepal Time
        # 07:00 NPT = 01:15 UTC, 13:00 NPT = 07:15 UTC, 20:00 NPT = 14:15 UTC
        - cron: "15 1 * * *"
        - cron: "15 7 * * *"
        - cron: "15 14 * * *"
    workflow_dispatch: # Allow manual trigger

jobs:
    scrape-and-process:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: agents/requirements.txt

            - name: Install dependencies
              run: pip install -r agents/requirements.txt

            - name: Run news scraper
              env:
                  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
                  NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
                  NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
                  ENVIRONMENT: production
              run: python -m agents.run scraper

            - name: Run content generator
              env:
                  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
                  NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
                  NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
                  ENVIRONMENT: production
              run: python -m agents.run generator

            - name: Run social publisher
              env:
                  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
                  NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
                  NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
                  X_API_KEY: ${{ secrets.X_API_KEY }}
                  X_API_SECRET: ${{ secrets.X_API_SECRET }}
                  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
                  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
                  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
                  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
                  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
                  ENVIRONMENT: production
              run: python -m agents.run publisher
